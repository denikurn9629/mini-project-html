<!DOCTYPE html>
<html>
<head>
    <title>My Remote Developer Journey</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="hero">
        <h1 class="title">WEB DEVELOPER;</h1>
        <p class="subtitle">Future Remote Developer - USA Market</p>
        <button id="hireBtn"class="btn">
            Hire Me
        </button>
        <button id="darkModeBtn" class="btn">
            Dark Mode
        </button>

        <br><br>

        <input type="text" id="nameInput" placeholder="Input your name">

    <button id="greetBtn" class="btn">
        Greeting Me
    </button>

    <p id="greeting"></p>
    
    </section>

    <section class="skills">
        <div class="card">
            <h3>HTML</h3>
            <p>Strong structure & semantic layout.</p>
        </div>

        <div class="card">
            <h3>CSS</h3>
            <p>Modern responsive design & flexbox.</p>
        </div>

        <div class="card">
            <h3>JavaScript</h3>
            <p>Interactive website & dynamic content.</p>
        </div>    
    </section>

    <div class="container">
    <div class="card">Contact Center</div>
    <div class="card">FAQ</div>
    <div class="card">Comment</div>
</div>

<script>

    //Hire Me
    const button = document.getElementById("hireBtn");

    button.addEventListener("click", function() {
        alert("Thanks call me 😎");
    });

    //Dark Mode
    const darkButton = document.getElementById("darkModeBtn")

    darkButton.addEventListener("click", function() {

        document.body.classList.toggle("dark");

        if (document.body.classList.contains("dark")) {

            darkButton.textContent = "☀ Light Mode"

        } else {

            darkButton.textContent = "🌙 Dark Mode"
        
        }
        
    });

    //Greeting
    const greetButton= document.getElementById("greetBtn");

greetButton.addEventListener("click", function() {

    const name = document.getElementById("nameInput").value;

    const greeting = document.getElementById("greeting");

    // Reset animation
    greeting.style.opacity = "0";

    greeting.style.transform = "translateY(20px)";

    setTimeout(function() {

        greeting.textContent = "Halo " + name + " 👋🏻";

        greeting.style.opacity = "1";

        greeting.style.transform = "translateY(0)";

    }, 100);

});

</script>

</body>
</html>
